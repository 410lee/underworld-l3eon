<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#09060d"><title>L3EON — Baltimore After Dark</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#08060b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:manipulation}.app{min-height:100dvh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(circle at 50% -10%,#5a2468,#09060d 62%);overflow:auto}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:1000;font-size:24px;letter-spacing:2px}.logo i{color:#b879ff;font-style:normal}.night{font-size:10px;padding:7px 10px;border-radius:99px;background:#1b1222;border:1px solid #473151;color:#dccbe4}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}.stat{background:#120c17;border:1px solid #32213c;border-radius:12px;text-align:center;padding:6px 2px;color:#a99aaa;font-size:8px}.stat b{display:block;color:#fff;font-size:13px}.energy{height:5px;background:#0d0910;border-radius:99px;overflow:hidden;margin-top:4px}.energy span{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ef78df)}.card{background:#17101f;border:1px solid #3b2746;border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 14px 35px #0009}h1{font-size:31px;line-height:1;margin:7px 0}h2{font-size:21px;margin:2px 0 7px}h3{margin:0 0 6px}p{color:#c1b3c8;line-height:1.42;margin:7px 0}.hero{text-align:center}.heroIcon{font-size:54px}.btn{width:100%;border:0;border-radius:15px;padding:14px;margin:5px 0;color:#fff;font-size:15px;font-weight:900;background:linear-gradient(135deg,#8054dd,#d35fdc);box-shadow:0 8px 18px #0007}.alt{background:#25172e;border:1px solid #513667;box-shadow:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:118px;text-align:left;padding:13px;border-radius:16px;border:1px solid #493057;background:#1a1022;color:#fff}.tile span{display:block;font-size:28px}.tile b{display:block;font-size:15px}.tile small{color:#b9a9c0;line-height:1.3}.choice{text-align:left;width:100%;padding:13px;margin:5px 0;background:#1b1123;border:1px solid #53376a;border-radius:15px;color:white}.choice strong{display:block;font-size:15px}.choice small{display:block;color:#c2b2ca;margin-top:4px}.list{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2d2034;color:#b9adbe}.list:last-child{border:0}.list b{color:#fff}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#321c45;border:1px solid #70468f;color:#dfbfff;font-size:10px;font-weight:900}.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#21132d;border:1px solid #9b68ca;border-radius:17px;padding:13px 17px;font-weight:900;z-index:20;box-shadow:0 18px 40px #000b;text-align:center}.footer{text-align:center;color:#6f6375;font-size:10px;padding:5px}
</style></head><body><div class="app"><div class="top"><div class="logo">L3<i>EON</i></div><div class="night" id="clock"></div></div><main id="game"></main><div class="footer">BALTIMORE AFTER DARK • L3EON</div></div><script>
const D={cash:100,fans:12,fame:0,rep:0,skill:1,energy:100,day:1,location:"Neighborhood",chapter:1,choice:0,crew:0,studio:0,car:0,style:0,relationship:0};
let S={...D};const g=document.getElementById("game"),clock=document.getElementById("clock");
function load(){try{S={...D,...JSON.parse(localStorage.l3bad||"{}")}}catch(e){}}
function save(){localStorage.l3bad=JSON.stringify(S)}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),950)}
function stats(){return `<div class="stats"><div class="stat">💵<b>$${S.cash}</b></div><div class="stat">👥<b>${S.fans}</b></div><div class="stat">⭐<b>${S.fame}</b></div><div class="stat">🗣️<b>${S.rep}</b></div><div class="stat">🔥<b>${S.skill}</b><div class="energy"><span style="width:${S.energy}%"></span></div></div></div>`}
function time(){clock.textContent=`DAY ${S.day} • ${S.energy>65?"8 PM":S.energy>30?"11:30 PM":"2 AM"}`}
function spend(n){if(S.energy<n){toast("😮‍💨 You need more energy");return false}S.energy-=n;return true}
function advance(){S.day++;S.energy=Math.min(100,S.energy+55);save();time()}
function level(){return S.fans>=500?"👑 HEADLINER":S.fans>=250?"🔥 BREAKOUT":S.fans>=100?"🌟 LOCAL STAR":"🎤 RISING ARTIST"}
function goal(){if(S.chapter===1)return"Prove yourself at the line and earn your first real spotlight.";if(S.chapter===2)return"Cut your first record and build a real fanbase.";if(S.chapter===3)return"Own the city without losing yourself.";if(S.chapter===4)return"Build the team and chase the bag.";return"Fill the main stage and become a Baltimore headliner."}
function menu(){time();g.innerHTML=stats()+`<section class="card hero"><div class="heroIcon">🌃🎤</div><h1>BALTIMORE<br>AFTER DARK</h1><p>Build L3EON from neighborhood talent into a Baltimore headliner. Your choices shape the story.</p><span class="pill">CHAPTER ${S.chapter>5?"EPILOGUE":S.chapter} • ${level()}</span><button class="btn" onclick="story()">📖 CONTINUE STORY</button><button class="btn alt" onclick="city()">🌃 FREE ROAM</button><button class="btn alt" onclick="profile()">👑 MY L3EON</button></section><section class="card"><h3>🎯 CURRENT GOAL</h3><p>${goal()}</p></section>`}
function scene(t,i,p,q,opts){g.innerHTML=stats()+`<section class="card"><div class="heroIcon">${i}</div><h2>${t}</h2><p>${p}</p><p><b>${q}</b></p>${opts.map((o,i)=>`<button class="choice" onclick="pick(${i})"><strong>${o[0]}</strong><small>${o[1]}</small></button>`).join("")}</section>`;window._opts=opts}
function story(){
 if(S.chapter===1)return scene("THE LINE","🥁","The gym is loud. Your sticks are ready. A rival crew wants to know if L3EON is really next up.","You can play it safe, or make a statement.",[
 ["🥁 Respect the pocket","Stay clean and disciplined.",()=>{S.skill++;S.rep+=18;S.choice++;}],
 ["🔥 Show out","Take the risk and make them remember you.",()=>{S.skill+=2;S.fame+=20;S.fans+=25;S.rep+=8;S.choice+=2;}]
 ]);
 if(S.chapter===2)return scene("FIRST SESSION","🎙️","A producer named Nia hears your voice after the battle. She offers studio time—but wants to know how serious you are.","What kind of artist are you becoming?",[
 ["💜 Tell the truth","Keep the music personal.",()=>{S.studio=1;S.fame+=20;S.fans+=30;S.relationship+=2;}],
 ["💰 Chase the hit","Go for the biggest sound possible.",()=>{S.studio=1;S.cash+=100;S.fans+=45;S.fame+=12;}]
 ]);
 if(S.chapter===3)return scene("THE CITY","🌃","Downtown knows your name now. A promoter offers a big night, while your old people need you back home.","Success is pulling you in two directions.",[
 ["🏠 Bring everybody with you","Build the movement together.",()=>{S.crew++;S.fans+=60;S.rep+=25;}],
 ["👑 Go solo","Bet on L3EON and move fast.",()=>{S.cash+=250;S.fame+=40;S.rep+=10;}]
 ]);
 if(S.chapter===4)return scene("THE BAG","💼","A manager puts a contract in front of you. The money is serious. The fine print is serious too.","Protect the name or take the deal?",[
 ["🛡️ Protect L3EON","Keep control of your music.",()=>{S.rep+=35;S.fame+=25;S.cash+=80;}],
 ["💵 Take the deal","Get paid now and learn the game later.",()=>{S.cash+=500;S.fans+=80;S.choice+=3;}]
 ]);
 if(S.chapter>=6)return ending();
 return finalShow()
}
function pick(i){let o=window._opts[i];o[2]();if(S.chapter<5&&S.choice>=2){S.chapter++;S.choice=0;toast("📖 CHAPTER UNLOCKED!")}advance();setTimeout(story,450)}
function finalShow(){
 if(S.rep<120||S.fans<250)return scene("ONE MORE NIGHT","🎟️","The main stage is close, but the promoter says you need more proof.","Build the crowd before you take the lights.",[
 ["🔥 Grind one more run","Hit the city hard.",()=>{S.fans+=70;S.rep+=30;S.fame+=20;}],
 ["🎤 Bet the show","Perform like you already belong.",()=>{S.fans+=100;S.rep+=45;S.fame+=50;S.cash+=200;}]
 ]);
 g.innerHTML=stats()+`<section class="card hero"><div class="heroIcon">👑🌃</div><h1>THE LIGHTS ARE YOURS</h1><p>The room goes dark. Then the first light hits. Baltimore is watching.</p><span class="pill">L3EON — HEADLINER</span><button class="btn" onclick="ending()">🎤 PLAY THE FINAL SHOW</button></section>`
}
function ending(){S.fans+=150;S.fame+=100;S.rep+=60;S.cash+=1000;S.chapter=6;save();g.innerHTML=stats()+`<section class="card hero"><div class="heroIcon">👑🎤🥁</div><h1>BALTIMORE<br>REMEMBERS</h1><p>You made it from the line to the lights. But this isn't the end of L3EON.</p><p><b>FANS: ${S.fans} • FAME: ${S.fame} • CASH: $${S.cash}</b></p><button class="btn" onclick="city()">KEEP THE CAREER GOING</button></section>`}
function city(){time();g.innerHTML=stats()+`<section class="card"><h2>🌃 FREE ROAM</h2><p>The city is awake. What are you doing tonight?</p><div class="grid"><button class="tile" onclick="drum()"><span>🥁</span><b>The Line</b><small>Drum battles<br>Cash + skill</small></button><button class="tile" onclick="mic()"><span>🎤</span><b>The Stage</b><small>Open mic<br>Fans + fame</small></button><button class="tile" onclick="work()"><span>💼</span><b>The Grind</b><small>Earn cash<br>Safe move</small></button><button class="tile" onclick="explore()"><span>🚗</span><b>Explore</b><small>Random encounter<br>Risk + reward</small></button></div></section><section class="card"><h3>🗺️ BALTIMORE</h3><div class="list"><span>Neighborhood</span><b>OPEN</b></div><div class="list"><span>Downtown</span><b>${S.fans>=100?"OPEN":"100 fans"}</b></div><div class="list"><span>The Industry</span><b>${S.fame>=100?"OPEN":"100 fame"}</b></div><div class="list"><span>Main Stage</span><b>${S.rep>=120?"OPEN":"120 rep"}</b></div></section><button class="btn alt" onclick="menu()">BACK</button>`}
function result(t,i,p){g.innerHTML=stats()+`<section class="card hero"><div class="heroIcon">${i}</div><h2>${t}</h2><p>${p}</p><button class="btn" onclick="city()">BACK TO CITY</button><button class="btn alt" onclick="story()">📖 STORY</button></section>`}
function drum(){if(!spend(28))return;let c=35+S.skill*12;S.cash+=c;S.fame+=8;S.fans+=12;S.rep+=14;if(Math.random()<.25)S.skill++;advance();result("THE LINE","🥁",`You enter a hard-hitting drum battle. The crowd feels the pocket and you leave with $${c}.`)}
function mic(){if(!spend(24))return;let n=20+S.skill*7;S.fans+=n;S.fame+=15;S.rep+=9;S.cash+=25;advance();result("OPEN MIC","🎤",`You grab the mic and give them a taste of L3EON. ${n} new people follow you.`)}
function work(){if(!spend(15))return;let p=65+Math.floor(Math.random()*45);S.cash+=p;S.rep+=3;advance();result("THE GRIND","💼",`You put in the hours and stack $${p}. Not glamorous—but the bankroll is growing.`)}
function explore(){if(!spend(20))return;let e=[["THE PRODUCER","🎛️","A local producer hears your demo.",25,12],["THE RIVAL","😤","A rival talks reckless. You keep your cool.",10,25],["THE FAN","💜","A stranger recognizes you and asks for a photo.",10,45],["THE OPPORTUNITY","📲","Someone offers you a small paid performance.",30,30]][Math.floor(Math.random()*4)];S.fame+=e[3];S.rep+=e[4];if(e[0]==="THE OPPORTUNITY")S.cash+=100;if(e[0]==="THE RIVAL")S.cash+=30;advance();result(e[0],e[1],e[2])}
function profile(){g.innerHTML=stats()+`<section class="card hero"><div class="heroIcon">👑</div><h2>L3EON PROFILE</h2><p>From the line to the lights.</p></section><section class="card"><div class="list"><span>Career</span><b>${level()}</b></div><div class="list"><span>Chapter</span><b>${S.chapter>5?"EPILOGUE":S.chapter}</b></div><div class="list"><span>Days Active</span><b>${S.day}</b></div><div class="list"><span>Studio</span><b>${S.studio?"🎙️ ACTIVE":"LOCKED"}</b></div><div class="list"><span>Crew</span><b>${S.crew?"🔥 BUILT":"Solo"}</b></div></section><button class="btn" onclick="menu()">KEEP BUILDING</button><button class="btn alt" onclick="localStorage.removeItem('l3bad');location.reload()">RESET CAREER</button>`}
load();menu();
</script></body></html>
